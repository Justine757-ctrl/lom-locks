<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C76D"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9E7628"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Emblème stylisé boucle de lock & éclat doré -->
  <g transform="translate(10, 16)">
    <!-- Anneau torsade / lock -->
    <path d="M24 4 C14 4 6 12 6 22 C6 31 13 38 22 39 C24 43 27 46 32 46 C37 46 41 42 41 37 C41 26 34 20 24 20 C18 20 14 24 14 28" 
          fill="none" stroke="url(#goldGradDark)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="24" cy="12" r="3" fill="#4A2C1D"/>
    <circle cx="34" cy="30" r="2.5" fill="url(#goldGradDark)"/>
    <!-- Petite étincelle / soin naturel -->
    <path d="M38 10 L40 14 L44 16 L40 18 L38 22 L36 18 L32 16 L36 14 Z" fill="url(#goldGradDark)"/>
  </g>

  <!-- Texte de marque LoméLocks -->
  <text x="68" y="47" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#4A2C1D">
    Lomé<tspan fill="url(#goldGradDark)" font-weight="800">Locks</tspan>
  </text>

  <!-- Sous-titre / Slogan discret -->
  <text x="70" y="64" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#75432B" text-transform="uppercase">
    Soin &amp; Coiffure au Naturel
  </text>
</svg>
