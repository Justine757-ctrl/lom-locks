<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDetox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140D"/>
      <stop offset="50%" stop-color="#3C2114"/>
      <stop offset="100%" stop-color="#190B06"/>
    </linearGradient>
    <linearGradient id="goldDetox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DF99"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8E6B27"/>
    </linearGradient>
    <radialGradient id="bubbleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(242, 223, 153, 0.4)"/>
      <stop offset="100%" stop-color="rgba(201, 162, 75, 0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgDetox)"/>

  <!-- Éléments détox : bassine stylisée et bulles pétillantes -->
  <g transform="translate(480, 140)">
    <!-- Bassine courbe -->
    <path d="M40 180 C70 230 210 230 240 180 C250 160 30 160 40 180 Z" fill="none" stroke="url(#goldDetox)" stroke-width="4"/>
    <ellipse cx="140" cy="170" rx="100" ry="24" fill="none" stroke="#C9A24B" stroke-width="2"/>
    <!-- Bulles pétillantes -->
    <circle cx="110" cy="110" r="16" fill="url(#bubbleGlow)" stroke="#F2DF99" stroke-width="1.5"/>
    <circle cx="160" cy="70" r="22" fill="url(#bubbleGlow)" stroke="#F2DF99" stroke-width="1.5"/>
    <circle cx="200" cy="120" r="12" fill="url(#bubbleGlow)" stroke="#F2DF99" stroke-width="1.5"/>
    <circle cx="80" cy="60" r="8" fill="#F2DF99" opacity="0.8"/>
    <circle cx="130" cy="30" r="5" fill="#F2DF99" opacity="0.9"/>
  </g>

  <!-- Badge Catégorie -->
  <rect x="60" y="60" width="160" height="34" rx="17" fill="rgba(201, 162, 75, 0.18)" stroke="#C9A24B" stroke-width="1"/>
  <text x="140" y="82" fill="#EEDDA2" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Soins Naturels</text>

  <!-- Titre -->
  <text x="60" y="160" fill="#FBF8F3" font-family="'Playfair Display', Georgia, serif" font-size="40" font-weight="700">
    <tspan x="60" dy="0">Tout savoir sur la</tspan>
    <tspan x="60" dy="48" fill="url(#goldDetox)">détox des locks</tspan>
  </text>
  <text x="60" y="270" fill="#DAB29D" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400">
    <tspan x="60" dy="0">Quand et comment purifier vos cheveux en profondeur</tspan>
    <tspan x="60" dy="28">pour éliminer poussière, transpiration et résidus.</tspan>
  </text>

  <text x="60" y="390" fill="#9E7628" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">LOMÉLOCKS • PURIFICATION CAPILLAIRE</text>
</svg>
